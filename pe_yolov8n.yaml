# PE-YOLOv8n — YOLOv8 nano with PENet pyramid enhancement head
# Based on: PE-YOLO (Xiangchen Yin et al., ICANN 2023) + Ultralytics YOLOv8n
#
# HOW TO USE:
#   1. Copy penet_module.py into ultralytics/nn/modules/penet.py
#   2. In ultralytics/nn/modules/__init__.py  add:
#        from .penet import PENet
#        and add 'PENet' to __all__
#   3. In ultralytics/nn/tasks.py parse_model(), add inside the module dispatch:
#        elif m is PENet:
#            c2 = 3
#            args = [*args]
#   4. Train:
#        python train.py --data exdark.yaml --cfg pe_yolov8n.yaml --weights ''
#
# Notes:
#   - PENet sits BEFORE the first Conv so it receives raw 3-ch RGB images.
#   - Output of PENet is still 3-ch; YOLOv8 backbone begins normally after it.
#   - No extra loss is used — end-to-end training on detection loss only.
#   - Depth / width / ratio are identical to standard yolov8n.yaml.

# ── Model scaling parameters (nano) ──────────────────────────────────────────
nc: 12         # ExDark has 12 classes
scales:
  n: [0.33, 0.25, 1024]   # depth, width, max_channels

# ── Backbone ─────────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]

  # ── PENet enhancement head (pre-backbone) ──────────────────────────────
  # in_channels=3, num_high=3, gauss_kernel_size=5
  - [-1, 1, PENet, [3, 3, 5]]              # 0 — P0/1 (3-ch enhanced image)

  # ── Standard YOLOv8n backbone (unchanged from yolov8n.yaml) ────────────
  - [-1, 1, Conv, [64, 3, 2]]              # 1 — P1/2   (stride 2 → H/2)
  - [-1, 1, Conv, [128, 3, 2]]             # 2 — P2/4   (stride 4 → H/4)
  - [-1, 3, C2f, [128, True]]              # 3
  - [-1, 1, Conv, [256, 3, 2]]             # 4 — P3/8   (stride 8 → H/8)
  - [-1, 6, C2f, [256, True]]              # 5
  - [-1, 1, Conv, [512, 3, 2]]             # 6 — P4/16  (stride 16 → H/16)
  - [-1, 6, C2f, [512, True]]              # 7
  - [-1, 1, Conv, [1024, 3, 2]]            # 8 — P5/32  (stride 32 → H/32)
  - [-1, 3, C2f, [1024, True]]             # 9
  - [-1, 1, SPPF, [1024, 5]]              # 10 — SPPF

# ── Head (PANet + anchor-free detection, standard YOLOv8n) ───────────────────
head:
  - [-1,  1, nn.Upsample, [None, 2, 'nearest']]  # 11 — upsample to P4
  - [[-1, 7], 1, Concat, [1]]                     # 12 — cat with backbone P4
  - [-1, 3, C2f, [512]]                           # 13

  - [-1,  1, nn.Upsample, [None, 2, 'nearest']]  # 14 — upsample to P3
  - [[-1, 5], 1, Concat, [1]]                     # 15 — cat with backbone P3
  - [-1, 3, C2f, [256]]                           # 16 — P3/8 output

  - [-1, 1, Conv, [256, 3, 2]]                    # 17 — downsample back
  - [[-1, 13], 1, Concat, [1]]                    # 18 — cat with head P4
  - [-1, 3, C2f, [512]]                           # 19 — P4/16 output

  - [-1, 1, Conv, [512, 3, 2]]                    # 20 — downsample back
  - [[-1, 10], 1, Concat, [1]]                    # 21 — cat with SPPF
  - [-1, 3, C2f, [1024]]                          # 22 — P5/32 output

  - [[16, 19, 22], 1, Detect, [nc]]               # 23 — detection (P3, P4, P5)
